# Builds an installable Android APK on GitHub's servers and attaches it to a
# GitHub Release, so it can be downloaded straight onto a phone or tablet.
name: Android APK

on:
  push:
    branches: [main, ccr-e5e142db-hisdnj]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk stock-overseee.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stock-overseee-apk
          path: stock-overseee.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Stock Overseee (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Tap **stock-overseee.apk** below to download, then open it to install.
            Built from `${{ github.ref_name }}` @ ${{ github.sha }}.
          files: stock-overseee.apk
